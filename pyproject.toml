[project]
name = "weather-dashboard"
version = "0.1.0"
description = "An 800x480 watercolor weather dashboard for Spectra 6 e-ink displays."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0,<13",
]

[project.scripts]
weather-dashboard = "weather_dashboard:main"

[dependency-groups]
dev = [
    "coverage>=7.10.6",
    "pre-commit>=4.3.0",
    "ruff>=0.12.12",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["weather_dashboard"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "single"
